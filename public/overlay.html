<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platnumz Cuesport | OBS Scoreboard Broadcast Overlay</title>

  <style>
    :root {
      --gold-light: #ffe885;
      --gold: #ffc800;
      --gold-dark: #b8860b;
      --cyan-glow: #00e5ff;
      --blue-start: #006ef6;
      --blue-mid: #0053d1;
      --blue-end: #003db3;
      --font-family: Arial, Helvetica, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: var(--font-family);
      color: #ffffff;
      user-select: none;
    }

    #canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    #overlay-wrapper {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.8));
    }

    body.pos-top #overlay-wrapper {
      bottom: auto;
      top: 24px;
    }

    /* ==========================================================
       MAIN TOP SCORE BAR
       Names & Scores have 1st Priority
       ========================================================== */
    .score-bar {
      position: relative;
      width: 100%;
      min-height: 96px;
      background: linear-gradient(180deg, var(--blue-start) 0%, var(--blue-mid) 50%, var(--blue-end) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      overflow: hidden;
      border-top: 1.5px solid rgba(255, 255, 255, 0.3);
    }

    /* Corner Wings */
    .corner-wing-left {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 32px;
      background: linear-gradient(135deg, #003685 0%, #001f52 100%);
      clip-path: polygon(0 0, 100% 0, 0 100%);
      pointer-events: none;
    }
    .corner-gold-left {
      position: absolute;
      left: 0;
      top: 0;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #ffe072 0%, #c59615 100%);
      clip-path: polygon(0 0, 100% 0, 0 100%);
      z-index: 2;
    }

    .corner-wing-right {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 32px;
      background: linear-gradient(225deg, #003685 0%, #001f52 100%);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      pointer-events: none;
    }
    .corner-gold-right {
      position: absolute;
      right: 0;
      top: 0;
      width: 22px;
      height: 22px;
      background: linear-gradient(225deg, #ffe072 0%, #c59615 100%);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      z-index: 2;
    }

    /* ==========================================================
       PLAYER 1 SECTION (Left-to-Right: Flag -> Name -> Score)
       ========================================================== */
    .player-zone-1 {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-right: 20px;
    }

    .player-1-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    /* ==========================================================
       PLAYER 2 SECTION (Left-to-Right: Score -> Name -> Flag)
       ========================================================== */
    .player-zone-2 {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-left: 20px;
    }

    .player-2-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    /* Flags: Compact to preserve maximum room for names */
    .flag-box {
      flex-shrink: 0;
      width: 52px;
      height: 34px;
      border-radius: 4px;
      overflow: hidden;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.45));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .flag-wave {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .flag-emoji {
      font-size: 34px;
      line-height: 1;
      display: none;
    }
    .avatar-photo {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold);
      display: none;
    }

    /* Player Names: 1st Priority High Prominence */
    .player-name {
      font-size: clamp(22px, 2.5vw, 42px);
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    /* Scores: 1st Priority High Prominence */
    .player-score {
      font-size: clamp(52px, 5.2vw, 82px);
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      min-width: 65px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .player-score.bump {
      transform: scale(1.25);
      color: #fff8cb;
    }

    /* Center Pill ("RACE TO 3"): Compact */
    .center-capsule-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0 14px;
      position: relative;
      z-index: 10;
    }

    .race-capsule {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 28px;
      border-radius: 9999px;
      background: linear-gradient(180deg, #ffc800 0%, #ffa500 50%, #ee7d00 100%);
      border: 3px solid #d48b00;
      box-shadow: 0 0 0 3.5px #faebbe, 0 4px 14px rgba(0, 0, 0, 0.45);
      white-space: nowrap;
    }

    .race-text {
      font-size: clamp(14px, 1.35vw, 21px);
      font-weight: 1000;
      color: #11151c;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .hill-hill-badge {
      display: none;
      position: absolute;
      top: -15px;
      background: #e61937;
      color: #ffffff;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 1000;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      animation: pulseHill 0.9s infinite alternate;
    }
    @keyframes pulseHill {
      from { transform: scale(0.96); filter: drop-shadow(0 0 4px #ff0055); }
      to { transform: scale(1.04); filter: drop-shadow(0 0 10px #ff0055); }
    }

    /* ==========================================================
       NEON CYAN DIVIDER LINE
       ========================================================== */
    .neon-cyan-divider {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #00b0ff 0%, #00f0ff 25%, #00ffff 50%, #00f0ff 75%, #00b0ff 100%);
      box-shadow: 0 0 8px #00e5ff, 0 0 16px rgba(0, 229, 255, 0.6);
      position: relative;
      z-index: 5;
    }

    /* ==========================================================
       BOTTOM INFORMATION / TICKER BAR
       Compact & High Legibility
       ========================================================== */
    .bottom-ticker-bar {
      position: relative;
      width: 100%;
      min-height: 36px;
      background: linear-gradient(180deg, #031842 0%, #020f2b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 36px;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .ticker-wing-left {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 34px;
      background: linear-gradient(135deg, #e5b839 0%, #b8860b 100%);
      clip-path: polygon(0 0, 100% 0, 0 100%);
      pointer-events: none;
    }
    .ticker-wing-right {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 34px;
      background: linear-gradient(225deg, #e5b839 0%, #b8860b 100%);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      pointer-events: none;
    }

    .ticker-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      font-size: clamp(10.5px, 1.05vw, 15px);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ticker-group {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .ticker-label {
      color: var(--gold);
      font-weight: 900;
      letter-spacing: 0.8px;
    }

    .ticker-val {
      color: #ffffff;
      font-weight: 800;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .ticker-divider {
      color: #ffffff;
      opacity: 0.65;
      font-weight: 300;
      margin: 0 2px;
    }

    /* KP Monogram & Brand */
    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--gold);
      font-weight: 1000;
      letter-spacing: 0.8px;
    }

    .kp-logo-icon {
      width: 24px;
      height: 18px;
      display: inline-block;
      vertical-align: middle;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
    }

    /* Winner celebration */
    #winner-banner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(3,24,66,0.98) 0%, rgba(2,12,35,0.99) 100%);
      border: 3px solid var(--gold);
      border-radius: 18px;
      padding: 26px 44px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 200, 0, 0.5), 0 20px 40px rgba(0,0,0,0.9);
      z-index: 100;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .winner-trophy { font-size: 44px; margin-bottom: 6px; }
    .winner-title {
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 3px;
      font-weight: 900;
    }
    .winner-player-name {
      font-size: 38px;
      font-weight: 1000;
      color: #fff;
      margin: 6px 0;
      text-shadow: 0 0 15px rgba(255, 200, 0, 0.5);
    }
    .winner-subtitle {
      font-size: 13px;
      color: var(--gold-light);
    }
  </style>
</head>

<body>
  <main id="canvas">
    <div id="overlay-wrapper">

      <!-- MAIN TOP SCORE BAR -->
      <section class="score-bar" aria-label="Platnumz Pool match scoreboard">
        <div class="corner-wing-left"></div>
        <div class="corner-gold-left"></div>

        <!-- PLAYER 1 ZONE (Left) -->
        <div class="player-zone-1">
          <div class="player-1-left">
            <div class="flag-box">
              <svg id="flagSvg1" class="flag-wave" viewBox="0 0 60 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="60" height="5.7" fill="#319241" />
                <rect y="5.7" width="60" height="5.7" fill="#FDD734" />
                <rect y="11.4" width="60" height="5.7" fill="#DE2026" />
                <rect y="17.1" width="60" height="5.7" fill="#000000" />
                <rect y="22.8" width="60" height="5.7" fill="#DE2026" />
                <rect y="28.5" width="60" height="5.7" fill="#FDD734" />
                <rect y="34.2" width="60" height="5.8" fill="#319241" />
                <polygon points="0,0 23,20 0,40" fill="#FFFFFF" stroke="#000000" stroke-width="1" />
                <polygon points="8,15 9.5,19 13.5,19 10.5,21.5 11.5,25.5 8,23 4.5,25.5 5.5,21.5 2.5,19 6.5,19" fill="#DE2026" />
                <circle cx="8" cy="20" r="2.2" fill="#FDD734" />
              </svg>
              <span id="flagEmoji1" class="flag-emoji">🇿🇼</span>
              <img id="avatarImg1" class="avatar-photo" alt="P1 Avatar" />
            </div>
            <div id="name1" class="player-name">CHAIRMAN TINDO</div>
          </div>

          <div id="score1" class="player-score">2</div>
        </div>

        <!-- CENTER RACE-TO CAPSULE -->
        <div class="center-capsule-container">
          <div id="hillHillBadge" class="hill-hill-badge">⚡ HILL - HILL ⚡</div>
          <div class="race-capsule">
            <span id="raceText" class="race-text">RACE TO 3</span>
          </div>
        </div>

        <!-- PLAYER 2 ZONE (Right) -->
        <div class="player-zone-2">
          <div id="score2" class="player-score">1</div>

          <div class="player-2-right">
            <div id="name2" class="player-name">BOSS OWIZA</div>
            <div class="flag-box">
              <svg id="flagSvg2" class="flag-wave" viewBox="0 0 60 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="60" height="5.7" fill="#319241" />
                <rect y="5.7" width="60" height="5.7" fill="#FDD734" />
                <rect y="11.4" width="60" height="5.7" fill="#DE2026" />
                <rect y="17.1" width="60" height="5.7" fill="#000000" />
                <rect y="22.8" width="60" height="5.7" fill="#DE2026" />
                <rect y="28.5" width="60" height="5.7" fill="#FDD734" />
                <rect y="34.2" width="60" height="5.8" fill="#319241" />
                <polygon points="0,0 23,20 0,40" fill="#FFFFFF" stroke="#000000" stroke-width="1" />
                <polygon points="8,15 9.5,19 13.5,19 10.5,21.5 11.5,25.5 8,23 4.5,25.5 5.5,21.5 2.5,19 6.5,19" fill="#DE2026" />
                <circle cx="8" cy="20" r="2.2" fill="#FDD734" />
              </svg>
              <span id="flagEmoji2" class="flag-emoji">🇿🇼</span>
              <img id="avatarImg2" class="avatar-photo" alt="P2 Avatar" />
            </div>
          </div>
        </div>

        <div class="corner-wing-right"></div>
        <div class="corner-gold-right"></div>
      </section>

      <!-- NEON CYAN DIVIDER LINE -->
      <div class="neon-cyan-divider"></div>

      <!-- BOTTOM INFORMATION / TICKER BAR -->
      <section class="bottom-ticker-bar" aria-label="Match information">
        <div class="ticker-wing-left"></div>

        <div class="ticker-content">
          <div class="ticker-group">
            <span class="ticker-label">TOURNAMENT:</span>
            <span id="tournament" class="ticker-val">PLATINUM SKILLS OPEN</span>
          </div>

          <span class="ticker-divider">|</span>

          <div class="ticker-group">
            <span class="ticker-label">VENUE:</span>
            <span id="venue" class="ticker-val">HARARE, ZIMBABWE</span>
          </div>

          <span class="ticker-divider">|</span>

          <div class="ticker-group">
            <span class="ticker-label">POT:</span>
            <span id="pot" class="ticker-val">$500</span>
          </div>

          <span class="ticker-divider">|</span>

          <div class="brand-group">
            <svg class="kp-logo-icon" viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 3H9V25H4V3Z" fill="url(#kpGoldGrad)" />
              <path d="M9 13.5L18 3H24.5L14 14.5L24.5 25H18L9 15.5" fill="url(#kpGoldGrad)" />
              <path d="M21 3H29C32.866 3 36 6.134 36 10C36 13.866 32.866 17 29 17H21V12.5H28C29.38 12.5 30.5 11.38 30.5 10C30.5 8.62 29.38 7.5 28 7.5H21V3Z" fill="url(#kpGoldGrad)" />
              <defs>
                <linearGradient id="kpGoldGrad" x1="0" y1="0" x2="36" y2="28" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FFE885" />
                  <stop offset="0.5" stop-color="#FFC800" />
                  <stop offset="1" stop-color="#C59615" />
                </linearGradient>
              </defs>
            </svg>
            <span id="brand">KRAVO PLATNUMZ OFFICIAL</span>
          </div>
        </div>

        <div class="ticker-wing-right"></div>
      </section>

    </div>

    <!-- WINNER CELEBRATION MODAL -->
    <div id="winner-banner">
      <div class="winner-trophy">🏆</div>
      <div class="winner-title">MATCH CHAMPION</div>
      <div id="winnerPlayerName" class="winner-player-name">CHAIRMAN TINDO</div>
      <div id="winnerDetails" class="winner-subtitle">VICTORY REACHED · PLATINUM SKILLS OPEN</div>
    </div>
  </main>

  <script>
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const requestedRoom = params.get("room") || "platnumz-live-match";
    const room = requestedRoom.replace(/[^a-zA-Z0-9_-]/g,"").slice(0,80) || "platnumz-live-match";

    const $ = id => document.getElementById(id);
    let lastScore1 = 2;
    let lastScore2 = 1;

    function safeScore(value) {
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, Math.min(999, Math.floor(n))) : 0;
    }

    function setText(id, value, fallback = "") {
      const el = $(id);
      if (!el) return;
      el.textContent = (value === null || value === undefined || value === "") ? fallback : String(value);
    }

    function renderScoreboard(state) {
      if (!state || typeof state !== "object") return;

      const s1 = safeScore(state.score1 !== undefined ? state.score1 : 2);
      const s2 = safeScore(state.score2 !== undefined ? state.score2 : 1);
      const race = Math.max(1, Math.min(999, parseInt(state.raceTo, 10) || 3));

      if (s1 !== lastScore1) triggerScoreBump("score1");
      if (s2 !== lastScore2) triggerScoreBump("score2");
      lastScore1 = s1;
      lastScore2 = s2;

      setText("name1", state.name1, "CHAIRMAN TINDO");
      setText("name2", state.name2, "BOSS OWIZA");
      setText("score1", s1, "2");
      setText("score2", s2, "1");
      setText("raceText", "RACE TO " + race, "RACE TO 3");

      setText("tournament", state.tournament, "PLATINUM SKILLS OPEN");
      setText("venue", state.venue, "HARARE, ZIMBABWE");
      setText("pot", state.pot, "$500");
      setText("brand", state.brand, "KRAVO PLATNUMZ OFFICIAL");

      // Flag handling
      const flag1 = state.flag1 || "🇿🇼";
      const flag2 = state.flag2 || "🇿🇼";

      if (state.avatar1) {
        $("avatarImg1").src = state.avatar1;
        $("avatarImg1").style.display = "block";
        $("flagSvg1").style.display = "none";
        $("flagEmoji1").style.display = "none";
      } else if (flag1 === "🇿🇼") {
        $("avatarImg1").style.display = "none";
        $("flagSvg1").style.display = "block";
        $("flagEmoji1").style.display = "none";
      } else {
        $("avatarImg1").style.display = "none";
        $("flagSvg1").style.display = "none";
        $("flagEmoji1").textContent = flag1;
        $("flagEmoji1").style.display = "block";
      }

      if (state.avatar2) {
        $("avatarImg2").src = state.avatar2;
        $("avatarImg2").style.display = "block";
        $("flagSvg2").style.display = "none";
        $("flagEmoji2").style.display = "none";
      } else if (flag2 === "🇿🇼") {
        $("avatarImg2").style.display = "none";
        $("flagSvg2").style.display = "block";
        $("flagEmoji2").style.display = "none";
      } else {
        $("avatarImg2").style.display = "none";
        $("flagSvg2").style.display = "none";
        $("flagEmoji2").textContent = flag2;
        $("flagEmoji2").style.display = "block";
      }

      // Hill-Hill Badge
      const isHillHill = (s1 === race - 1 && s2 === race - 1);
      $("hillHillBadge").style.display = isHillHill ? "block" : "none";

      // Position
      const pos = state.overlayPosition || "bottom";
      document.body.className = "pos-" + pos;

      // Winner
      if (s1 >= race || s2 >= race) {
        const winner = s1 >= race ? (state.name1 || "CHAIRMAN TINDO") : (state.name2 || "BOSS OWIZA");
        $("winnerPlayerName").textContent = winner;
        $("winnerDetails").textContent = `${s1 >= race ? s1 : s2} - ${s1 >= race ? s2 : s1} (Race to ${race}) · ${state.tournament || "PLATINUM SKILLS OPEN"}`;
        $("winner-banner").style.display = "block";
      } else {
        $("winner-banner").style.display = "none";
      }
    }

    function triggerScoreBump(id) {
      const el = $(id);
      if (!el) return;
      el.classList.add("bump");
      setTimeout(() => el.classList.remove("bump"), 250);
    }

    // 1. REAL-TIME SERVER-SENT EVENTS (SSE) STREAM
    function connectSse() {
      try {
        const sse = new EventSource('/api/sync/' + encodeURIComponent(room) + '/events');
        sse.onmessage = (event) => {
          if (event.data) {
            try {
              const data = JSON.parse(event.data);
              renderScoreboard(data);
            } catch (err) {}
          }
        };
        sse.onerror = () => {
          sse.close();
          setTimeout(connectSse, 2000);
        };
      } catch (e) {}
    }
    connectSse();

    // 2. IMMEDIATE HTTP FETCH FOR ZERO DELAY INITIAL LOAD
    fetch('/api/sync/' + encodeURIComponent(room))
      .then(res => res.json())
      .then(data => {
        if (data.success && data.state) renderScoreboard(data.state);
      })
      .catch(() => {});

    // 3. BROADCASTCHANNEL API FOR LOCAL ZERO-LATENCY CROSS-TAB SYNC
    try {
      const channel = new BroadcastChannel("platnumz_scoreboard_bus");
      channel.onmessage = (event) => {
        if (event.data && typeof event.data === "object") {
          renderScoreboard(event.data);
        }
      };
    } catch (e) {}

    // 4. STORAGE EVENT LISTENER
    window.addEventListener("storage", (e) => {
      if (e.key === "platnumz-scoreboard-state" && e.newValue) {
        try {
          renderScoreboard(JSON.parse(e.newValue));
        } catch (err) {}
      }
    });

    // Initial render from local cache or default
    try {
      const saved = localStorage.getItem("platnumz-scoreboard-state");
      if (saved) {
        renderScoreboard(JSON.parse(saved));
      } else {
        renderScoreboard({
          name1: "CHAIRMAN TINDO",
          name2: "BOSS OWIZA",
          score1: 2,
          score2: 1,
          raceTo: 3,
          flag1: "🇿🇼",
          flag2: "🇿🇼",
          tournament: "PLATINUM SKILLS OPEN",
          venue: "HARARE, ZIMBABWE",
          pot: "$500",
          brand: "KRAVO PLATNUMZ OFFICIAL"
        });
      }
    } catch (e) {}
  </script>
</body>
</html>
