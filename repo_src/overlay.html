<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platnumz Cuesport | OBS Scoreboard Broadcast Overlay</title>

  <style>
    :root {
      --gold-light: #ffe885;
      --gold: #ffc800;
      --gold-dark: #b8860b;
      --cyan-glow: #00e5ff;
      --blue-start: #0066f6;
      --blue-mid: #004ecc;
      --blue-end: #003699;
      --bg-dark: rgba(9, 13, 22, 0.96);
      --font-family: Arial, Helvetica, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: var(--font-family);
      color: #ffffff;
      user-select: none;
    }

    #canvas {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }

    /* COMPACT HORIZONTAL BROADCAST OVERLAY WRAPPER (Matching Reference Image) */
    #overlay-wrapper {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 24px;
      width: min(880px, calc(100% - 40px));
      max-width: 880px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.88), 0 0 0 1px rgba(255, 255, 255, 0.16);
      background: var(--bg-dark);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }

    body.pos-top #overlay-wrapper {
      bottom: auto;
      top: 24px;
    }

    /* ==========================================================
       1. MAIN TOP SCOREBOARD (Compact, Thinner, High-Contrast)
       ========================================================== */
    .score-bar {
      position: relative;
      width: 100%;
      min-height: 56px;
      height: 58px;
      background: linear-gradient(180deg, #141b2b 0%, #0a0f1a 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 14px;
    }

    /* PLAYER 1 SECTION (Left: Flag -> Name -> Score Box) */
    .player-zone-1 {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
    }

    .player-1-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    /* PLAYER 2 SECTION (Right: Score Box -> Name -> Flag) */
    .player-zone-2 {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }

    .player-2-info {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    /* ALL COUNTRY FLAGS (Sharp & Correctly Proportioned) */
    .flag-box {
      flex-shrink: 0;
      width: 44px;
      height: 29px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .flag-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .flag-display {
      font-size: 24px;
      line-height: 1;
      display: none;
    }

    .avatar-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* PLAYER NAMES: Large, Bold, Prominently Legible */
    .player-name {
      font-size: clamp(17px, 1.55vw, 24px);
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
    }

    .player-2-info .player-name {
      text-align: right;
    }

    /* BREAK & RUN BADGES */
    .br-badge {
      display: none;
      align-items: center;
      gap: 3px;
      background: linear-gradient(135deg, #ffd700, #ff9900);
      color: #0b111c;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* PLAYER SCORES (High-Contrast White Boxes matching Reference Image) */
    .score-box {
      background: #ffffff;
      color: #090e18;
      min-width: 64px;
      height: 42px;
      padding: 0 10px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(26px, 2.3vw, 34px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15), 0 3px 8px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .score-box.bump {
      transform: scale(1.18);
      background: #fff8cb;
    }

    /* ==========================================================
       2. CENTRAL MATCH INFORMATION — PRESERVE "RACE TO"
       (Cobalt Blue Broadcast Capsule matching Reference Image)
       ========================================================== */
    .center-capsule-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0 4px;
      position: relative;
      z-index: 10;
    }

    .race-capsule {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      height: 42px;
      border-radius: 5px;
      background: linear-gradient(180deg, var(--blue-start) 0%, var(--blue-mid) 100%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 2px 8px rgba(0, 78, 204, 0.45);
      white-space: nowrap;
    }

    .race-text {
      font-size: clamp(13px, 1.15vw, 16px);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    /* Hill-Hill Deciding Frame Alert */
    .hill-hill-badge {
      display: none;
      position: absolute;
      top: -13px;
      background: #e61937;
      color: #ffffff;
      padding: 1px 8px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      animation: pulseHill 0.9s infinite alternate;
      white-space: nowrap;
    }
    @keyframes pulseHill {
      from { transform: scale(0.96); filter: drop-shadow(0 0 4px #ff0055); }
      to { transform: scale(1.04); filter: drop-shadow(0 0 8px #ff0055); }
    }

    /* ==========================================================
       3. NEW DEDICATED BOTTOM INFORMATION BAR
       Single horizontal row: VENUE | TOURNAMENT | POT | BRAND
       ========================================================== */
    .bottom-ticker-bar {
      position: relative;
      width: 100%;
      min-height: 36px;
      height: 38px;
      background: rgba(5, 8, 15, 0.98);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .ticker-content {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      font-size: clamp(12.5px, 1.15vw, 14.5px);
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      gap: 12px;
    }

    .ticker-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      flex-shrink: 1;
    }

    .ticker-label {
      color: var(--gold);
      font-weight: 900;
      letter-spacing: 0.8px;
      font-size: 13px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .ticker-val {
      color: #ffffff;
      font-weight: 700;
      font-size: 13.5px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ticker-divider {
      color: rgba(255, 255, 255, 0.35);
      font-weight: 400;
      font-size: 13.5px;
      flex-shrink: 0;
      user-select: none;
      margin: 0 2px;
    }

    .brand-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--gold);
      font-weight: 900;
      letter-spacing: 0.8px;
      font-size: 13px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .kp-logo-icon {
      width: 21px;
      height: 17px;
      display: inline-block;
      vertical-align: middle;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
      flex-shrink: 0;
    }

    /* WINNER CELEBRATION MODAL */
    #winner-banner {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(3,24,66,0.98) 0%, rgba(2,12,35,0.99) 100%);
      border: 3px solid var(--gold);
      border-radius: 18px;
      padding: 26px 44px;
      text-align: center;
      box-shadow: 0 0 50px rgba(255, 200, 0, 0.5), 0 20px 40px rgba(0,0,0,0.9);
      z-index: 100;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .winner-trophy { font-size: 44px; margin-bottom: 6px; }
    .winner-title {
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 3px;
      font-weight: 900;
    }
    .winner-player-name {
      font-size: 38px;
      font-weight: 1000;
      color: #fff;
      margin: 6px 0;
      text-shadow: 0 0 15px rgba(255, 200, 0, 0.5);
    }
    .winner-subtitle {
      font-size: 13px;
      color: var(--gold-light);
    }
  </style>
</head>

<body>
  <main id="canvas">
    <div id="overlay-wrapper">

      <!-- 1. MAIN TOP SCOREBOARD -->
      <section class="score-bar" aria-label="Platnumz Pool match scoreboard">

        <!-- PLAYER 1 ZONE (Left: Flag -> Name & B&R -> Score) -->
        <div class="player-zone-1">
          <div class="flag-box">
            <img id="flagImg1" class="flag-img" alt="P1 Flag" />
            <span id="flagDisplay1" class="flag-display">🇿🇼</span>
            <img id="avatarImg1" class="avatar-photo" alt="P1 Avatar" />
          </div>

          <div class="player-1-info">
            <div id="name1" class="player-name">CHAIRMAN TINDO</div>
            <div id="brBadge1" class="br-badge">🔥 B&R: <span id="brVal1">0</span></div>
          </div>

          <div id="score1" class="score-box">2</div>
        </div>

        <!-- CENTER RACE-TO CAPSULE -->
        <div class="center-capsule-container">
          <div id="hillHillBadge" class="hill-hill-badge">⚡ HILL - HILL ⚡</div>
          <div class="race-capsule">
            <span id="raceText" class="race-text">RACE TO 3</span>
          </div>
        </div>

        <!-- PLAYER 2 ZONE (Right: Score -> Name & B&R -> Flag) -->
        <div class="player-zone-2">
          <div id="score2" class="score-box">1</div>

          <div class="player-2-info">
            <div id="brBadge2" class="br-badge">🔥 B&R: <span id="brVal2">0</span></div>
            <div id="name2" class="player-name">BOSS OWIZA</div>
          </div>

          <div class="flag-box">
            <img id="flagImg2" class="flag-img" alt="P2 Flag" />
            <span id="flagDisplay2" class="flag-display">🇿🇼</span>
            <img id="avatarImg2" class="avatar-photo" alt="P2 Avatar" />
          </div>
        </div>

      </section>

      <!-- 2. DEDICATED BOTTOM INFORMATION BAR -->
      <section class="bottom-ticker-bar" aria-label="Match information">
        <div class="ticker-content">
          <div class="ticker-group">
            <span class="ticker-label">VENUE:</span>
            <span id="venue" class="ticker-val">HARARE, ZIMBABWE</span>
          </div>

          <span class="ticker-divider">|</span>

          <div class="ticker-group">
            <span class="ticker-label">TOURNAMENT:</span>
            <span id="tournament" class="ticker-val">PLATINUM SKILLS OPEN</span>
          </div>

          <span class="ticker-divider">|</span>

          <div class="ticker-group">
            <span class="ticker-label">POT:</span>
            <span id="pot" class="ticker-val">$500</span>
          </div>

          <span class="ticker-divider">|</span>

          <div class="brand-group">
            <svg class="kp-logo-icon" viewBox="0 0 36 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 3H9V25H4V3Z" fill="url(#kpGoldGrad)" />
              <path d="M9 13.5L18 3H24.5L14 14.5L24.5 25H18L9 15.5" fill="url(#kpGoldGrad)" />
              <path d="M21 3H29C32.866 3 36 6.134 36 10C36 13.866 32.866 17 29 17H21V12.5H28C29.38 12.5 30.5 11.38 30.5 10C30.5 8.62 29.38 7.5 28 7.5H21V3Z" fill="url(#kpGoldGrad)" />
              <defs>
                <linearGradient id="kpGoldGrad" x1="0" y1="0" x2="36" y2="28" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#FFE885" />
                  <stop offset="0.5" stop-color="#FFC800" />
                  <stop offset="1" stop-color="#C59615" />
                </linearGradient>
              </defs>
            </svg>
            <span id="brand">KRAVO PLATNUMZ OFFICIAL</span>
          </div>
        </div>
      </section>

    </div>

    <!-- WINNER CELEBRATION MODAL -->
    <div id="winner-banner">
      <div class="winner-trophy">🏆</div>
      <div class="winner-title">MATCH CHAMPION</div>
      <div id="winnerPlayerName" class="winner-player-name">CHAIRMAN TINDO</div>
      <div id="winnerDetails" class="winner-subtitle">VICTORY REACHED · PLATINUM SKILLS OPEN</div>
    </div>
  </main>

  <script>
    "use strict";

    const params = new URLSearchParams(window.location.search);
    const requestedRoom = params.get("room") || "platnumz-live-match";
    const room = requestedRoom.replace(/[^a-zA-Z0-9_-]/g,"").slice(0,80) || "platnumz-live-match";

    const $ = id => document.getElementById(id);
    let lastScore1 = 2;
    let lastScore2 = 1;
    let lastUpdatedAt = 0;

    function safeScore(value) {
      const n = Number(value);
      return Number.isFinite(n) ? Math.max(0, Math.min(999, Math.floor(n))) : 0;
    }

    function setText(id, value, fallback) {
      const el = $(id);
      if (!el) return;
      if (value !== undefined && value !== null && String(value).trim() !== "") {
        el.textContent = String(value);
      } else {
        el.textContent = fallback || "";
      }
    }

    function getIsoCode(flag) {
      if (!flag) return "zw";
      const str = String(flag).trim();
      if (/^[a-zA-Z]{2}$/.test(str)) return str.toLowerCase();
      if (/^[a-zA-Z]{2}-[a-zA-Z]{3}$/.test(str)) return str.toLowerCase();
      const codePoints = Array.from(str).map(c => c.codePointAt(0) || 0);
      const chars = codePoints
        .filter(cp => cp >= 127462 && cp <= 127487)
        .map(cp => String.fromCharCode(cp - 127397));
      if (chars.length === 2) return chars.join("").toLowerCase();
      return "zw";
    }

    function updateFlagUI(flagVal, avatarVal, imgId, fallbackId, avatarId) {
      const avatarEl = $(avatarId);
      const flagImg = $(imgId);
      const fallback = $(fallbackId);

      if (avatarVal) {
        avatarEl.src = avatarVal;
        avatarEl.style.display = "block";
        if (flagImg) flagImg.style.display = "none";
        if (fallback) fallback.style.display = "none";
        return;
      }

      if (avatarEl) avatarEl.style.display = "none";
      const code = getIsoCode(flagVal);
      if (flagImg) {
        flagImg.src = "https://flagcdn.com/w160/" + code + ".png";
        flagImg.style.display = "block";
        flagImg.onerror = function() {
          this.style.display = "none";
          if (fallback) {
            fallback.textContent = flagVal || "🇿🇼";
            fallback.style.display = "block";
          }
        };
      }
      if (fallback) {
        fallback.textContent = flagVal || "🇿🇼";
      }
    }

    function renderScoreboard(state) {
      if (!state || typeof state !== "object") return;

      const s1 = safeScore(state.score1 !== undefined ? state.score1 : 2);
      const s2 = safeScore(state.score2 !== undefined ? state.score2 : 1);
      const race = Math.max(1, Math.min(999, parseInt(state.raceTo, 10) || 3));

      if (s1 !== lastScore1) triggerScoreBump("score1");
      if (s2 !== lastScore2) triggerScoreBump("score2");
      lastScore1 = s1;
      lastScore2 = s2;

      setText("name1", state.name1, "CHAIRMAN TINDO");
      setText("name2", state.name2, "BOSS OWIZA");
      setText("score1", s1, "2");
      setText("score2", s2, "1");
      setText("raceText", "RACE TO " + race, "RACE TO 3");

      setText("venue", state.venue, "HARARE, ZIMBABWE");
      setText("tournament", state.tournament, "PLATINUM SKILLS OPEN");
      setText("pot", state.pot, "$500");
      setText("brand", state.brand, "KRAVO PLATNUMZ OFFICIAL");

      // Uniform Flag handling for Zimbabwe and all world countries
      updateFlagUI(state.flag1 || "🇿🇼", state.avatar1, "flagImg1", "flagDisplay1", "avatarImg1");
      updateFlagUI(state.flag2 || "🇿🇼", state.avatar2, "flagImg2", "flagDisplay2", "avatarImg2");

      // Break and Run badges
      const br1 = parseInt(state.br1, 10) || 0;
      const br2 = parseInt(state.br2, 10) || 0;
      if (br1 > 0) {
        $("brVal1").textContent = br1;
        $("brBadge1").style.display = "inline-flex";
      } else {
        $("brBadge1").style.display = "none";
      }
      if (br2 > 0) {
        $("brVal2").textContent = br2;
        $("brBadge2").style.display = "inline-flex";
      } else {
        $("brBadge2").style.display = "none";
      }

      // Hill-Hill Badge
      const isHillHill = (s1 === race - 1 && s2 === race - 1);
      $("hillHillBadge").style.display = isHillHill ? "block" : "none";

      // Position
      const pos = state.overlayPosition || "bottom";
      document.body.className = "pos-" + pos;

      // Winner
      if (s1 >= race || s2 >= race) {
        const winner = s1 >= race ? (state.name1 || "CHAIRMAN TINDO") : (state.name2 || "BOSS OWIZA");
        $("winnerPlayerName").textContent = winner;
        $("winnerDetails").textContent = `${s1 >= race ? s1 : s2} - ${s1 >= race ? s2 : s1} (Race to ${race}) · ${state.tournament || "PLATINUM SKILLS OPEN"}`;
        $("winner-banner").style.display = "block";
      } else {
        $("winner-banner").style.display = "none";
      }
    }

    function handleIncomingState(data) {
      if (!data || typeof data !== "object") return;
      const incomingTime = Number(data.updatedAt) || 0;
      // Do not overwrite newer local user details with older baseline/default server state
      if (lastUpdatedAt > incomingTime && incomingTime > 1) {
        return;
      }
      if (incomingTime > 0) {
        lastUpdatedAt = incomingTime;
      }
      try {
        localStorage.setItem("platnumz-scoreboard-state", JSON.stringify(data));
      } catch (e) {}
      renderScoreboard(data);
    }

    function triggerScoreBump(id) {
      const el = $(id);
      if (!el) return;
      el.classList.add("bump");
      setTimeout(() => el.classList.remove("bump"), 250);
    }

    // 1. REAL-TIME SERVER-SENT EVENTS (SSE) STREAM
    function connectSse() {
      try {
        const sse = new EventSource('/api/sync/' + encodeURIComponent(room) + '/events');
        sse.onmessage = (event) => {
          if (event.data) {
            try {
              const data = JSON.parse(event.data);
              handleIncomingState(data);
            } catch (err) {}
          }
        };
        sse.onerror = () => {
          sse.close();
          setTimeout(connectSse, 2000);
        };
      } catch (e) {}
    }
    connectSse();

    // 2. IMMEDIATE HTTP FETCH FOR ZERO DELAY INITIAL LOAD
    fetch('/api/sync/' + encodeURIComponent(room))
      .then(res => res.json())
      .then(data => {
        if (data.success && data.state) handleIncomingState(data.state);
      })
      .catch(() => {});

    // 3. BROADCASTCHANNEL API FOR LOCAL ZERO-LATENCY CROSS-TAB SYNC
    try {
      const channel = new BroadcastChannel("platnumz_scoreboard_bus");
      channel.onmessage = (event) => {
        if (event.data && typeof event.data === "object") {
          handleIncomingState(event.data);
        }
      };
    } catch (e) {}

    // 4. STORAGE EVENT LISTENER
    window.addEventListener("storage", (e) => {
      if (e.key === "platnumz-scoreboard-state" && e.newValue) {
        try {
          handleIncomingState(JSON.parse(e.newValue));
        } catch (err) {}
      }
    });

    // Initial render from local cache or default
    try {
      const saved = localStorage.getItem("platnumz-scoreboard-state");
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && typeof parsed === "object") {
          lastUpdatedAt = Number(parsed.updatedAt) || 0;
          renderScoreboard(parsed);
        }
      } else {
        renderScoreboard({
          name1: "CHAIRMAN TINDO",
          name2: "BOSS OWIZA",
          score1: 2,
          score2: 1,
          raceTo: 3,
          flag1: "🇿🇼",
          flag2: "🇿🇼",
          br1: 0,
          br2: 0,
          tournament: "PLATINUM SKILLS OPEN",
          venue: "HARARE, ZIMBABWE",
          pot: "$500",
          brand: "KRAVO PLATNUMZ OFFICIAL",
          updatedAt: 1
        });
      }
    } catch (e) {}
  </script>
</body>
</html>
